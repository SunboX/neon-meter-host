name: Build installers

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            release_tag:
                description: Release tag to build and upload, for example v1.0.0.
                required: false
                type: string

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.platform }} ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: false
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: mac
                      arch: x64
                      runner: macos-15-intel
                    - platform: mac
                      arch: arm64
                      runner: macos-14
                    - platform: win
                      arch: x64
                      runner: windows-2025-vs2026
                    - platform: win
                      arch: arm64
                      runner: windows-11-arm
                    - platform: linux
                      arch: x64
                      runner: ubuntu-latest
                    - platform: linux
                      arch: arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Check out repository
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.event.inputs.release_tag || github.ref }}

            - name: Set up Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux native build dependencies
              if: matrix.platform == 'linux'
              run: sudo apt-get update && sudo apt-get install -y libudev-dev

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build installer
              run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}

            - name: Upload target dist
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: dist-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/*.AppImage
                      dist/*.blockmap
                      dist/*.deb
                      dist/*.dmg
                      dist/*.exe
                      dist/*.tar.gz
                      dist/*.zip
                      dist/*.yml
                      !dist/builder-debug.yml
                      !dist/builder-effective-config.yaml
                  if-no-files-found: error
                  retention-days: 14

    collect:
        name: Collect installers
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download target artifacts into dist
              uses: actions/download-artifact@v8.0.1
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true

            - name: Upload combined dist
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: dist
                  path: dist/**
                  if-no-files-found: error
                  retention-days: 14

            - name: Resolve release tag
              id: release
              if: >-
                  github.event_name == 'release' ||
                  (github.event_name == 'workflow_dispatch' &&
                  github.event.inputs.release_tag != '')
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "release" ]; then
                      tag="${{ github.event.release.tag_name }}"
                  elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
                      tag="${{ github.event.inputs.release_tag }}"
                  else
                      tag="${GITHUB_REF_NAME}"
                  fi
                  echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

            - name: Upload installers to GitHub release
              if: steps.release.outputs.tag != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ steps.release.outputs.tag }}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
