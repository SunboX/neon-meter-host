name: Build installers

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ matrix.platform }} ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: false
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: mac
                      arch: x64
                      runner: macos-15-intel
                    - platform: mac
                      arch: arm64
                      runner: macos-14
                    - platform: win
                      arch: x64
                      runner: windows-latest
                    - platform: win
                      arch: arm64
                      runner: windows-11-arm
                    - platform: linux
                      arch: x64
                      runner: ubuntu-latest
                    - platform: linux
                      arch: arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build installer
              run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}

            - name: Upload target dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/*.AppImage
                      dist/*.blockmap
                      dist/*.deb
                      dist/*.dmg
                      dist/*.exe
                      dist/*.tar.gz
                      dist/*.zip
                      dist/*.yml
                      !dist/builder-debug.yml
                      !dist/builder-effective-config.yaml
                  if-no-files-found: error
                  retention-days: 14

    collect:
        name: Collect installers
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download target artifacts into dist
              uses: actions/download-artifact@v4
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true

            - name: Upload combined dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/**
                  if-no-files-found: error
                  retention-days: 14
